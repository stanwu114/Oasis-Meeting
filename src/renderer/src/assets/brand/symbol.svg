<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OASIS symbol</title>
  <desc id="desc">Clean editable vector symbol with the approved orange gradient.</desc>
  <defs>
    <linearGradient id="qOrange" x1="174" y1="122" x2="768" y2="894" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8f2d"/>
      <stop offset="0.42" stop-color="#ff7300"/>
      <stop offset="1" stop-color="#e44600"/>
    </linearGradient>
    <radialGradient id="qHighlight" cx="320" cy="190" r="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.23"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="qCutout" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="white"/>
      <ellipse cx="516.4" cy="514" rx="268.6" ry="268.6" fill="black"/>
      <path d="M654.7 709.0 C721.3 786.0 798.5 843.2 935.1 826.4" fill="none" stroke="black" stroke-width="49.5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g id="symbol" mask="url(#qCutout)">
    <ellipse cx="512" cy="514" rx="431" ry="437" fill="url(#qOrange)"/>
    <ellipse cx="512" cy="514" rx="431" ry="437" fill="url(#qHighlight)"/>
  </g>
</svg>
