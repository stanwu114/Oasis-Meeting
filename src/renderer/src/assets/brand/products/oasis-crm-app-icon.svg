<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Oasis CRM app icon</title>
  <desc id="desc">OASIS product icon for Oasis CRM, using the approved shared Q symbol and an orange customer nodes motif.</desc>
  <defs>
    <linearGradient id="tile" x1="170" y1="86" x2="840" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.56" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#f3eee7"/>
    </linearGradient>
    <linearGradient id="qOrange" x1="226" y1="144" x2="754" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8f2d"/>
      <stop offset="0.42" stop-color="#ff7300"/>
      <stop offset="1" stop-color="#e44600"/>
    </linearGradient>
    <radialGradient id="qHighlight" cx="356" cy="204" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.23"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-12%" y="-8%" width="124%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#231b16" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#231b16" flood-opacity=".13"/>
    </filter>
    <mask id="qCutout" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="white"/>
      <ellipse cx="515.6" cy="514" rx="221.8" ry="221.8" fill="black"/>
      <path d="M629.8 674.6 C684.8 738.2 748.5 785.4 861.3 771.5" fill="none" stroke="black" stroke-width="40.9" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="96" y="82" width="832" height="832" rx="158" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="96.5" y="82.5" width="831" height="831" rx="157.5" fill="none" stroke="#e6e0d8" stroke-opacity=".72"/>
  <g id="symbol" mask="url(#qCutout)">
    <ellipse cx="512" cy="514" rx="356" ry="361" fill="url(#qOrange)"/>
    <ellipse cx="512" cy="514" rx="356" ry="361" fill="url(#qHighlight)"/>
  </g>
  <g id="crm-nodes" fill="#FF7A00">
    <circle cx="512" cy="438" r="32"/>
    <circle cx="430" cy="584" r="28"/>
    <circle cx="594" cy="584" r="28"/>
  </g>
  <g id="crm-links" fill="none" stroke="#FF7A00" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 466 L444 556"/>
    <path d="M524 466 L580 556"/>
  </g>
</svg>
